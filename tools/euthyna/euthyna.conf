# Euthyna's settings. `bin/euthyna` reads this file; every setting here is also
# a command-line option, which wins over what is set here.

# The Logos checkout to measure. Euthyna never writes to it: a run copies the
# tree into a staging directory and works there (see docs/method.md).
LOGOS_ROOT="${HOME}/logos"

# Where snapshots are written, relative to this directory. One directory per
# run, named for the date and the Logos commit measured.
SNAPSHOT_DIR="data/snapshots"

# Measures that need a built Logos (`lake build`) are skipped unless this is
# yes. Only check-checker-soundness is in that class; every other measure reads
# source text and runs in seconds.
RUN_BUILD_MEASURES="no"
