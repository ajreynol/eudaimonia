# The launcher's settings. `bin/launch` reads this file; every setting here is
# also a command-line option, which wins over what is set here.
#
# This is the counterpart of config.sh two directories up: the same role in the
# same shape, one level of abstraction higher. That file settles what a checker
# is called and what calculus it checks; this one settles where a launch writes
# and what runs it. The specification itself is not here in either case -- there
# it is a signature and its semantics, here it is an answered interview.

# The agent command to hand a prompt to. It must be on PATH. `--agent` sets it
# per run, which is the usual way: nothing here depends on which one it is, and
# a prompt that only works with one of them is a prompt with a bug in it.
AGENT="claude"

# How the agent is invoked. "interactive" hands over the terminal and lets you
# watch and interrupt, which is the default because a launch is a thing you
# supervise. "print" runs it non-interactively and prints the result, which is
# for a transcript you intend to keep, not for leaving unattended.
MODE="interactive"

# Where filled-in interviews live, relative to this directory. One file per
# launch. Not kept in git -- see answers/README.md for why that reason is not
# the same as the one that keeps generated checkers out of git.
ANSWER_DIR="answers"

# The default target: the directory a launch writes into. Almost always given
# per run with --target, since it is a fact about one launch and not a setting.
#
# It must exist and it must be a directory a person created. `bin/launch` will
# not create it, will not `git init` it, and will not accept a path inside this
# repository.
TARGET=""

# Refuse to launch into a target that already contains files. A repository with
# a README in it is the normal case after the naming workflow has run, so this
# is turned off with --force rather than being off by default: overwriting
# somebody's work is the failure that costs the most and warns the least.
REQUIRE_EMPTY="yes"
