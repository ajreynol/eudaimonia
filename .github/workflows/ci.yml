name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Eunoia compiler is a C++ build; GMP is its only unusual dependency.
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgmp-dev

      - name: Install Lean
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # `lake --version` would need a toolchain to resolve, and there is no
          # default one; the shim existing is what this step is responsible for.
          test -x "$HOME/.elan/bin/lake" || { echo "elan left no lake shim" >&2; exit 1; }

      # Generates a checker for each option configuration, installs its
      # calculus, and runs that project's own CI. Around two minutes: the
      # Eunoia compiler is built once and shared, and only the small examples
      # are built -- CPC is generated and installed but not compiled, which
      # would take minutes and exercises the compiler rather than the generator.
      - name: Generate and check every configuration
        run: scripts/run-ci.sh

  # Linux is what the matrix above covers. This is the smoke test that says the
  # toolchain works on macOS too: different libc, different Homebrew prefix, BSD
  # userland rather than GNU (no `nproc`, no `md5sum`, `sed -i` needing an
  # argument). One configuration, generated, installed, built and CI'd -- enough
  # to catch a portability regression without paying for the whole matrix on a
  # slower runner.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install gmp cmake

      # elan ships release tarballs, not an install script: `elan-init.sh` is a
      # 404. Piping that into `sh` left `sh` to report the pipeline's status, so
      # the step passed having installed nothing and the failure only surfaced
      # later as `lake: command not found`. Download the tarball for the
      # runner's architecture, as the Linux job does, and check the result.
      - name: Install Lean
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            arm64|aarch64) target=aarch64-apple-darwin ;;
            *)             target=x86_64-apple-darwin ;;
          esac
          curl -sSfL "https://github.com/leanprover/elan/releases/latest/download/elan-${target}.tar.gz" | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          test -x "$HOME/.elan/bin/lake" || { echo "elan left no lake shim" >&2; exit 1; }

      - name: Generate, install and check one configuration
        run: |
          scripts/new-checker.sh --checker Mac --calculus Hello \
            --spec examples/hello --out checkers/.mac
          cd checkers/.mac/Mac
          ./install/get-eo-compiler.sh
          ./install/install-hello.sh
          ./scripts/run-ci.sh

